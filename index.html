<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The $1,000,000 Solana Wall 2026</title>
  <!-- مكتبة Solana Web3 للدفع الفوري بنقرة واحدة -->
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: sans-serif; 
      background-color: #0f172a; 
      color: #ffffff; 
      text-align: center; 
      margin: 0; 
      padding: 10px; 
    }
    h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 5px; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 15px; }
    
    .stats-bar { 
      background: #1e293b; 
      display: inline-block; 
      padding: 10px 20px; 
      border-radius: 20px; 
      font-weight: bold; 
      color: #4ade80; 
      margin-bottom: 20px; 
      border: 1px solid #334155; 
      font-size: 0.9rem;
    }
    .stats-bar span { color: #38bdf8; font-size: 1.1rem; }

    /* تعديل الجدار ليكون ضخماً وقابلاً للتمرير */
    .wall-wrapper {
      max-width: 100%;
      height: 65vh; /* تحديد ارتفاع الجدار ليناسب شاشة الهاتف */
      overflow: auto; /* إضافة شريط تمرير (Scroll) */
      background: #1e293b; 
      padding: 10px; 
      border-radius: 12px;
      border: 1px solid #334155;
    }

    /* استخدام شبكة متجاوبة تصغر المربعات لتشمل أكبر عدد ممكن */
    .wall-container { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(15px, 1fr)); 
      gap: 2px; 
    }
    
    .pixel { 
      aspect-ratio: 1; 
      background-color: #334155; 
      border-radius: 2px; 
      cursor: pointer; 
      background-size: cover; 
      background-position: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .pixel:hover { border: 1px solid #38bdf8; transform: scale(1.5); z-index: 2; }
    
    .pixel .owner-name {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 0.4rem;
      padding: 1px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pixel:hover .owner-name { display: block; }

    /* نوافذ الدفع */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9; }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #38bdf8; z-index: 10; width: 85%; max-width: 350px; text-align: left; }
    .modal h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    .modal label { display: block; margin-top: 10px; font-size: 0.85rem; color: #cbd5e1; }
    .modal input { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .modal button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
    
    .btn-pay { background: #ab9ff2; color: #0f172a; } /* لون Phantom */
    .btn-close { background: #475569; color: #fff; margin-top: 8px !important; }
  </style>
</head>
<body>

  <h1>The $1,000,000 Wall 2026</h1>
  <p>Pay 1-Click via <strong>Phantom Wallet</strong> & Claim $1 per Pixel</p>
  
  <div class="stats-bar">
    Claimed: <span id="counter">0</span> / 1,000,000 | Raised: $<span id="money">0</span>
  </div>

  <div class="wall-wrapper">
    <div class="wall-container" id="wall"></div>
  </div>

  <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>

  <div class="modal" id="modal">
    <h3>Claim Pixel <span id="square-num"></span></h3>
    <label>Your Name / Brand:</label>
    <input type="text" id="username" placeholder="e.g. Alex / My Company">
    
    <label>Your Image Link (URL):</label>
    <input type="text" id="userimg" placeholder="https://example.com/image.png">

    <button class="btn-pay" id="pay-btn" onclick="payWithPhantom()">Pay $1 via Phantom</button>
    <button class="btn-close" onclick="closeModal()">Cancel</button>
  </div>

  <script>
    // عنوان محفظة Phantom الخاصة بك
    const RECEIVER_WALLET = "7JBPrmfhn5JhXu5Tq3yLjoAAqgeH55GBukkc7maxcNU"; 

    const wall = document.getElementById('wall');
    const modal = document.getElementById('modal');
    const overlay = document.getElementById('overlay');
    const squareNum = document.getElementById('square-num');
    const counter = document.getElementById('counter');
    const money = document.getElementById('money');
    let currentSquare = null;

    // تم ضبط المربعات المعروضة على 10,000 لحماية متصفح الهاتف من الانهيار
    const RENDERED_PIXELS = 10000; 

    for (let i = 1; i <= RENDERED_PIXELS; i++) {
      const pixel = document.createElement('div');
      pixel.className = 'pixel';
      pixel.id = `square-${i}`;
      
      const nameTag = document.createElement('span');
      nameTag.className = 'owner-name';
      pixel.appendChild(nameTag);

      pixel.onclick = () => openModal(i);
      wall.appendChild(pixel);
    }

    function openModal(id) {
      currentSquare = id;
      squareNum.innerText = `#${id}`;
      modal.style.display = 'block';
      overlay.style.display = 'block';
    }

    function closeModal() {
      modal.style.display = 'none';
      overlay.style.display = 'none';
    }

    async function payWithPhantom() {
      const name = document.getElementById('username').value;
      const imgUrl = document.getElementById('userimg').value;

      if (!name || !imgUrl) {
        alert("Please write your name and image URL first.");
        return;
      }

      const isPhantomInstalled = window.solana && window.solana.isPhantom;

      if (isPhantomInstalled) {
        try {
          const btn = document.getElementById('pay-btn');
          btn.innerText = "Connecting Phantom...";

          const resp = await window.solana.connect();
          const provider = window.solana;

          btn.innerText = "Confirming $1 Payment...";

          const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'));

          // ما يعادل تقريباً 1 دولار بعمله SOL (حوالي 7 مليون لامبورت)
          const lamports = 7000000; 

          const transaction = new solanaWeb3.Transaction().add(
            solanaWeb3.SystemProgram.transfer({
              fromPubkey: resp.publicKey,
              toPubkey: new solanaWeb3.PublicKey(RECEIVER_WALLET),
              lamports: lamports,
            })
          );

          transaction.feePayer = resp.publicKey;
          let { blockhash } = await connection.getLatestBlockhash();
          transaction.recentBlockhash = blockhash;

          const { signature } = await provider.signAndSendTransaction(transaction);
          
          applyOwnership(currentSquare, name, imgUrl);
          alert("Payment Successful! Transaction Signature: " + signature);
          closeModal();

        } catch (err) {
          alert("Payment canceled or failed: " + err.message);
        } finally {
          document.getElementById('pay-btn').innerText = "Pay $1 via Phantom";
        }
      } else {
        // العرض المباشر للتجربة
        applyOwnership(currentSquare, name, imgUrl);
        alert("Phantom Wallet not detected! Displaying pixel in Demo Mode.");
        closeModal();
      }
    }

    function applyOwnership(squareId, name, imgUrl) {
      const sq = document.getElementById(`square-${squareId}`);
      sq.style.backgroundImage = `url('${imgUrl}')`;
      sq.querySelector('.owner-name').innerText = name;
      
      // تحديث العداد والمبلغ المجموع
      let count = parseInt(counter.innerText.replace(/,/g, ''));
      let currentMoney = parseInt(money.innerText.replace(/,/g, ''));
      
      counter.innerText = (count + 1).toLocaleString();
      money.innerText = (currentMoney + 1).toLocaleString();
    }
  </script>
</body>
</html>
