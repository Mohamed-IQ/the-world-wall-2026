<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World Wall 2026</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background-color: #0f172a; color: #ffffff; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 5px; }
    p { color: #94a3b8; font-size: 1rem; margin-bottom: 15px; }
    .stats-bar { background: #1e293b; display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: bold; color: #4ade80; margin-bottom: 20px; border: 1px solid #334155; }
    .wall-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; max-width: 500px; margin: 0 auto; background: #1e293b; padding: 15px; border-radius: 12px; }
    .pixel { aspect-ratio: 1; background-color: #334155; border-radius: 4px; cursor: pointer; border: 1px solid #475569; background-size: cover; background-position: center; }
    .pixel:hover { border-color: #38bdf8; transform: scale(1.05); }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9; }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #38bdf8; z-index: 10; width: 85%; max-width: 350px; text-align: left; }
    .modal h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    .modal label { display: block; margin-top: 10px; font-size: 0.85rem; color: #cbd5e1; }
    .modal input { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .crypto-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: center; }
    .crypto-address { font-family: monospace; font-size: 0.75rem; color: #4ade80; word-break: break-all; background: #1e293b; padding: 6px; border-radius: 4px; margin-top: 5px; }
    .modal button { width: 100%; padding: 10px; margin-top: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    .btn-pay { background: #38bdf8; color: #0f172a; }
    .btn-close { background: #475569; color: #fff; }
  </style>
</head>
<body>

  <h1>The World Wall 2026</h1>
  <p>Own a piece of digital history for <strong>$1 (USDT)</strong></p>
  
  <div class="stats-bar">
    Participants: <span id="counter">0</span> / 100
  </div>

  <div class="wall-container" id="wall"></div>
  <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>

  <div class="modal" id="modal">
    <h3>Claim Square <span id="square-num"></span></h3>
    <label>Your Name / Nickname:</label>
    <input type="text" id="username" placeholder="e.g. Alex">
    <label>Image Direct URL (Link):</label>
    <input type="text" id="userimg" placeholder="https://example.com/image.png">
    
    <div class="crypto-box">
      <div style="font-size: 0.8rem; color: #cbd5e1;">Send $1 USDT (TRC20) to:</div>
      <div class="crypto-address">TVPUAsLCJawmWfdV3rBGFwPtNiKonMQiZ4</div>
    </div>

    <button class="btn-pay" onclick="submitForm()">I Have Completed Payment</button>
    <button class="btn-close" onclick="closeModal()">Cancel</button>
  </div>

  <script>
    const wall = document.getElementById('wall');
    const modal = document.getElementById('modal');
    const overlay = document.getElementById('overlay');
    const squareNum = document.getElementById('square-num');
    const counter = document.getElementById('counter');
    let currentSquare = null;

    for (let i = 1; i <= 100; i++) {
      const pixel = document.createElement('div');
      pixel.className = 'pixel';
      pixel.id = `square-${i}`;
      pixel.onclick = () => openModal(i);
      wall.appendChild(pixel);
    }

    function openModal(id) {
      currentSquare = id;
      squareNum.innerText = `#${id}`;
      modal.style.display = 'block';
      overlay.style.display = 'block';
    }

    function closeModal() {
      modal.style.display = 'none';
      overlay.style.display = 'none';
    }

    function submitForm() {
      const imgUrl = document.getElementById('userimg').value;
      if(imgUrl) {
        const sq = document.getElementById(`square-${currentSquare}`);
        sq.style.backgroundImage = `url('${imgUrl}')`;
        let count = parseInt(counter.innerText);
        counter.innerText = count + 1;
      }
      alert('Thank you! Payment verification is in progress.');
      closeModal();
    }
  </script>
</body>
</html>
