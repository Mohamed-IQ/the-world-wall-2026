<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The $1,000,000 Wall 2026</title>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- مكتبة الاحتفال -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root { --primary: #38bdf8; --bg: #0f172a; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
    
    header { padding: 40px 20px; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
    h1 { font-size: 3rem; margin: 0; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .stats-container { display: flex; justify-content: center; gap: 20px; margin: 20px; }
    .stat-card { background: #1e293b; padding: 15px 25px; border-radius: 15px; border: 1px solid #334155; }
    .stat-card div { font-size: 1.5rem; color: var(--primary); font-weight: bold; }

    .wall-wrapper { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .wall-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(20px, 1fr)); gap: 3px; }
    
    .pixel { aspect-ratio: 1; background: #334155; border-radius: 3px; cursor: pointer; transition: 0.3s; position: relative; }
    .pixel:hover { transform: scale(1.2); box-shadow: 0 0 10px var(--primary); z-index: 10; }
    .pixel img { width: 100%; height: 100%; border-radius: 3px; object-fit: cover; display: none; }
    
    /* تصميم النافذة المنبثقة */
    .modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e293b; padding:30px; border-radius:20px; z-index:100; border:2px solid var(--primary); width:300px; }
    input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; }
    button { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; background: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>THE MILLION DOLLAR WALL</h1>
    <div class="stats-container">
      <div class="stat-card">Pixels Claimed<div id="counter">0</div></div>
      <div class="stat-card">Raised ($)<div id="money">0</div></div>
    </div>
  </header>

  <div class="wall-wrapper">
    <div class="wall-container" id="wall"></div>
  </div>

  <div class="modal" id="modal">
    <h3>Own this Pixel</h3>
    <input type="text" id="username" placeholder="Your Name">
    <input type="text" id="userimg" placeholder="Image URL">
    <button onclick="payWithPhantom()">Confirm $1 Payment</button>
  </div>

  <script>
    // ضع الـ Config الخاص بـ Firebase هنا
    const firebaseConfig = { /* ... ضع بياناتك هنا ... */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // إنشاء الشبكة
    const wall = document.getElementById('wall');
    for (let i = 1; i <= 2500; i++) {
        const div = document.createElement('div');
        div.className = 'pixel';
        div.id = `sq-${i}`;
        div.onclick = () => { document.getElementById('modal').style.display='block'; window.currentId = i; };
        div.innerHTML = `<img id="img-${i}"><span style="font-size:8px; display:none" id="name-${i}"></span>`;
        wall.appendChild(div);
    }

    // جلب البيانات مع تأثير احتفالي عند تحديث جديد
    db.ref('pixels').on('child_added', (snapshot) => {
        const id = snapshot.key;
        const val = snapshot.val();
        const el = document.getElementById(`sq-${id}`);
        const img = document.getElementById(`img-${id}`);
        
        img.src = val.imgUrl;
        img.style.display = 'block';
        el.title = val.name;
        
        // تأثير الاحتفال
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    });

    async function payWithPhantom() {
        // ... (كود الدفع كما في السابق) ...
        const name = document.getElementById('username').value;
        const imgUrl = document.getElementById('userimg').value;
        db.ref('pixels/' + window.currentId).set({ name, imgUrl });
        document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
